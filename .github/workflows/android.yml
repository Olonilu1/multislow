name: Build APK

# Builds the whole Android app in the cloud: the DNS tunnel client, the Go
# library, and the APK. Run it from the Actions tab ("Run workflow") or push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install SDK platform and NDK
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Build dnstt-client for arm64 (shipped as libdnstt.so)
        run: |
          git clone --depth 1 https://www.bamsoftware.com/git/dnstt.git /tmp/dnstt
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cd /tmp/dnstt/dnstt-client
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" \
            -o "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libdnstt.so" .

      - name: Build Go library with gomobile
        run: |
          go get golang.org/x/mobile/bind
          go mod tidy
          go test -count=1 .
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android/arm64 -androidapi 24 -o android/app/libs/multislow.aar ./mobile

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: multislow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
