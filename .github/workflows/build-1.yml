name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          test -f multislow.zip || { echo "multislow.zip is missing from the repo root"; exit 1; }
          unzip -q multislow.zip
          ls multislow

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install SDK platform and NDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-34" "platforms;android-24" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Build dnstt-client for arm64
        run: |
          git clone https://www.bamsoftware.com/git/dnstt.git /tmp/dnstt
          mkdir -p multislow/android/app/src/main/jniLibs/arm64-v8a
          cd /tmp/dnstt/dnstt-client
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" \
            -o "$GITHUB_WORKSPACE/multislow/android/app/src/main/jniLibs/arm64-v8a/libdnstt.so" .

      - name: Build Go library with gomobile
        working-directory: multislow
        run: |
          go mod tidy
          go get -tool golang.org/x/mobile/cmd/gobind
          go get golang.org/x/mobile/bind
          go test -count=1 .
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android/arm64 -androidapi 24 -o android/app/libs/multislow.aar ./mobile

      - name: Build APK
        working-directory: multislow/android
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: multislow-debug-apk
          path: multislow/android/app/build/outputs/apk/debug/app-debug.apk
